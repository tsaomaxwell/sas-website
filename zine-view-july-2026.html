<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>July 2026 Zine Reader | Starving Artist Society</title>
    <link rel="icon" type="image/png" href="assets/sas-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="zine-view.css" />
  </head>
  <body class="zine-view-page">
    <main class="zine-view-shell">
      <div class="slider zine-reader" data-slider>
        <div class="zine-reader-mobile-chrome">
          <div class="zine-reader-mobile-brand">STARVING ARTIST SOCIETY</div>
          <a class="zine-reader-mobile-close" href="zine.html" aria-label="Close zine reader">&times;</a>
        </div>

        <button class="slider-arrow zine-reader-arrow zine-reader-arrow-left" type="button" data-direction="-1" aria-label="Previous page">
          <span class="zine-reader-arrow-icon" aria-hidden="true">&#8250;</span>
          <span class="zine-reader-arrow-label">Back</span>
        </button>

        <div class="slider-track zine-reader-track">
          <article class="slide zine-reader-slide" data-variant="mobile">
            <div class="zine-mobile-page zine-mobile-page-cover">
              <div class="zine-mobile-stage">
                <img class="zine-mobile-image" src="assets/SAS_July,2026_Final/Front Cover_July2026.png" alt="July 2026 zine mobile front cover." />
              </div>
            </div>
          </article>

          <article class="slide zine-reader-slide" data-variant="mobile">
            <div class="zine-mobile-page">
              <div class="zine-mobile-stage">
                <img class="zine-mobile-image" src="assets/SAS_July,2026_Final/Mobile View Page 1_July2026.jpg" alt="July 2026 zine mobile page 1." />
              </div>
            </div>
          </article>

          <article class="slide zine-reader-slide" data-variant="mobile">
            <div class="zine-mobile-page">
              <div class="zine-mobile-stage">
                <img class="zine-mobile-image" src="assets/SAS_July,2026_Final/Mobile View Page 2_July2026.jpg" alt="July 2026 zine mobile page 2." />
              </div>
            </div>
          </article>

          <article class="slide zine-reader-slide" data-variant="mobile">
            <div class="zine-mobile-page">
              <div class="zine-mobile-stage">
                <img class="zine-mobile-image" src="assets/SAS_July,2026_Final/Mobile View Page 3_July2026.png" alt="July 2026 zine mobile page 3." />
              </div>
            </div>
          </article>

          <article class="slide zine-reader-slide" data-variant="mobile">
            <div class="zine-mobile-page">
              <div class="zine-mobile-stage">
                <img class="zine-mobile-image" src="assets/SAS_July,2026_Final/Mobile View Page 4_July2026.png" alt="July 2026 zine mobile page 4." />
              </div>
            </div>
          </article>

          <article class="slide zine-reader-slide" data-variant="mobile">
            <div class="zine-mobile-page">
              <div class="zine-mobile-stage">
                <img class="zine-mobile-image" src="assets/SAS_July,2026_Final/Mobile View Page 5_July2026.png" alt="July 2026 zine mobile page 5." />
              </div>
            </div>
          </article>

          <article class="slide zine-reader-slide" data-variant="mobile">
            <div class="zine-mobile-page">
              <div class="zine-mobile-stage">
                <img class="zine-mobile-image" src="assets/SAS_July,2026_Final/Mobile View Page 6_July2026.png" alt="July 2026 zine mobile page 6." />
              </div>
            </div>
          </article>

          <article class="slide zine-reader-slide" data-variant="mobile">
            <div class="zine-mobile-page">
              <div class="zine-mobile-stage">
                <img class="zine-mobile-image" src="assets/SAS_July,2026_Final/Mobile View Page 7_July2026.png" alt="July 2026 zine mobile page 7." />
              </div>
            </div>
          </article>

          <article class="slide zine-reader-slide" data-variant="mobile">
            <div class="zine-mobile-page">
              <div class="zine-mobile-stage">
                <img class="zine-mobile-image" src="assets/SAS_July,2026_Final/Mobile View Page 8_July2026.png" alt="July 2026 zine mobile page 8." />
              </div>
            </div>
          </article>

          <article class="slide zine-reader-slide" data-variant="mobile">
            <div class="zine-mobile-page">
              <div class="zine-mobile-stage">
                <img class="zine-mobile-image" src="assets/SAS_July,2026_Final/Back Cover_July2025.png" alt="July 2026 zine mobile back cover." />
              </div>
            </div>
          </article>

          <article class="slide slide-active zine-reader-slide" data-variant="desktop">
            <img class="zine-reader-image" src="assets/SAS_July,2026_Final/Front Cover_July2026.png" alt="July 2026 zine desktop front cover." />
          </article>

          <article class="slide zine-reader-slide" data-variant="desktop">
            <img class="zine-reader-image" src="assets/SAS_July,2026_Final/Desktop View 1 (pages 1-2)_July2026.png" alt="July 2026 zine desktop spread 1." />
          </article>

          <article class="slide zine-reader-slide" data-variant="desktop">
            <img class="zine-reader-image" src="assets/SAS_July,2026_Final/Desktop View 2 (pages 3-4).png" alt="July 2026 zine desktop spread 2." />
          </article>

          <article class="slide zine-reader-slide" data-variant="desktop">
            <img class="zine-reader-image" src="assets/SAS_July,2026_Final/Desktop View 3 (pages 5-6).png" alt="July 2026 zine desktop spread 3." />
          </article>

          <article class="slide zine-reader-slide" data-variant="desktop">
            <img class="zine-reader-image" src="assets/SAS_July,2026_Final/Desktop View 4 (pages 7-8).png" alt="July 2026 zine desktop spread 4." />
          </article>

          <article class="slide zine-reader-slide" data-variant="desktop">
            <img class="zine-reader-image" src="assets/SAS_July,2026_Final/Back Cover_July2025.png" alt="July 2026 zine desktop back cover." />
          </article>
        </div>

        <button class="slider-arrow zine-reader-arrow zine-reader-arrow-right" type="button" data-direction="1" aria-label="Next page">
          <span class="zine-reader-arrow-label">Next</span>
          <span class="zine-reader-arrow-icon" aria-hidden="true">&#8250;</span>
        </button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
