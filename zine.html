          <button

          >
            <span></span>
            <span></span>
            <span></span>
          </button>
        </nav>

        <div class="mobile-menu" id="mobile-menu">
          <div class="menu-panel">
            <div class="menu-links">
              <a class="menu-link" href="index.html#top">Home</a>
              <a class="menu-link" href="events.html#top">Events</a>
              <a class="menu-link is-current" href="zine.html">Zines</a>

      <main>

              <a

                aria-label="Open Zine 1 spreads"
              >
                <img
                  class="zine-detail-disc"
                  src="assets/Untitled_Artwork 10.png"
                  alt="Zine 1 CD artwork"
                />
                <div class="zine-detail-meta">
                  <p>Redefine what it means to be a starving artist: hungry to create</p>
                  <span>Zine 01</span>
                </div>

            </div>

            <p class="zine-detail-hint">Click on the CD to view the Zine :)</p>
          </div>
