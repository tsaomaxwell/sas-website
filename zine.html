<!DOCTYPE html>

        <nav class="topbar">
          <a class="brand" href="index.html#top">Starving Artist Society</a>
          <button
            class="menu-button"

            aria-controls="mobile-menu"
            aria-label="Toggle navigation"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
        </nav>

        <div class="mobile-menu" id="mobile-menu">
          <div class="menu-panel">
            <div class="menu-links">
              <a class="menu-link" href="index.html#top">Home</a>
              <a class="menu-link" href="events.html#top">Events</a>
              <a class="menu-link is-current" href="zine.html">Zines</a>
              <a class="menu-link" href="gallery.html">Archives</a>

            <div class="menu-divider"></div>

            <a class="menu-secondary" href="privacy.html">Privacy Policy</a>

            <div class="menu-socials">

              <a href="https://www.youtube.com/@StarvingArtistSociety" target="_blank" rel="noreferrer">YouTube</a>
            </div>
          </div>
        </div>

        <div class="hero-image zine-hero-image">
          <div class="hero-overlay events-hero-overlay">
            <div class="hero-center-title">Zines</div>
          </div>
        </div>
      </header>

      <main>
        <section class="panel zine-library-panel" id="zines">
          <div class="zine-library-heading">
            <p class="zine-library-kicker">Starving Artist Society Presents</p>
            <h1>Zine Library</h1>
          </div>

          <div class="zine-viewbox-grid">
            <article class="zine-viewbox-card" id="zine-july-2026">
              <a
                class="zine-viewbox-link"
                href="zine-view-july-2026.html"
                aria-label="Open July 2026 zine"
              >
                <img
                  src="assets/SAS_July,2026_Final/Front Cover_July2026.png"
                  alt="July 2026 zine cover"
                />
                <span class="zine-viewbox-label">View Zine</span>
              </a>
              <h2>July 2026</h2>
            </article>

            <article class="zine-viewbox-card" id="zine-june-2026">
              <a
                class="zine-viewbox-link"
                href="zine-view-june-2026.html"
                aria-label="Open June 2026 zine"
              >
                <img
                  src="assets/SAS_June,2026_Final/SAS_June,2026_Final_Grain1.png"
                  alt="June 2026 zine cover"
                />
                <span class="zine-viewbox-label">View Zine</span>
              </a>
              <h2>June 2026</h2>
            </article>

            <article class="zine-viewbox-card" id="zine-01">
              <a
                class="zine-viewbox-link"
                href="zine-view.html"
                aria-label="Open Zine 1"
              >
                <img
                  src="assets/zine pages desktop/cover.png"
                  alt="Zine 1 cover"
                />
                <span class="zine-viewbox-label">View Zine</span>
              </a>
              <h2>May 2026</h2>
            </article>
