<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>June 2026 Zine Reader | Starving Artist Society</title>
    <link rel="icon" type="image/png" href="assets/sas-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="zine-view.css" />
  </head>
  <body class="zine-view-page">
    <main class="zine-view-shell">
      <div class="slider zine-reader" data-slider>
        <div class="zine-reader-mobile-chrome">
          <div class="zine-reader-mobile-brand">STARVING ARTIST SOCIETY</div>
          <a class="zine-reader-mobile-close" href="zine.html" aria-label="Close zine reader">&times;</a>
        </div>

        <button class="slider-arrow zine-reader-arrow zine-reader-arrow-left" type="button" data-direction="-1" aria-label="Previous page">
          <span class="zine-reader-arrow-icon" aria-hidden="true">&#8250;</span>
          <span class="zine-reader-arrow-label">Back</span>
        </button>

        <div class="slider-track zine-reader-track">
          <article class="slide zine-reader-slide" data-variant="mobile">
            <div class="zine-mobile-page zine-mobile-page-cover">
              <div class="zine-mobile-stage">
                <img class="zine-mobile-image" src="assets/SAS_June,2026_Final/SAS_June,2026_Final_Grain1.png" alt="June 2026 zine mobile page 1." />
              </div>
            </div>
          </article>

          <article class="slide zine-reader-slide" data-variant="mobile">
            <div class="zine-mobile-page">
              <div class="zine-mobile-stage">
                <img class="zine-mobile-image" src="assets/SAS_June,2026_Final/SAS_June,2026_Final_Grain2.png" alt="June 2026 zine mobile page 2." />
              </div>
            </div>
          </article>

          <article class="slide zine-reader-slide" data-variant="mobile">
            <div class="zine-mobile-page">
              <div class="zine-mobile-stage">
                <img class="zine-mobile-image" src="assets/SAS_June,2026_Final/SAS_June,2026_Final_Grain3.png" alt="June 2026 zine mobile page 3." />
              </div>
            </div>
          </article>

          <article class="slide zine-reader-slide" data-variant="mobile">
            <div class="zine-mobile-page">
              <div class="zine-mobile-stage">
                <img class="zine-mobile-image" src="assets/SAS_June,2026_Final/SAS_June,2026_Final_Grain4.png" alt="June 2026 zine mobile page 4." />
              </div>
            </div>
          </article>

          <article class="slide zine-reader-slide" data-variant="mobile">
            <div class="zine-mobile-page">

                <img class="zine-mobile-image" src="assets/SAS_June,2026_Final/SAS_June,2026_Final_Grain5.png" alt="June 2026 zine mobile page 5." />
              </div>
            </div>
          </article>

          <article class="slide zine-reader-slide" data-variant="mobile">
            <div class="zine-mobile-page">
              <div class="zine-mobile-stage">
                <img class="zine-mobile-image" src="assets/SAS_June,2026_Final/SAS_June,2026_Final_Grain6.png" alt="June 2026 zine mobile page 6." />
              </div>
            </div>
          </article>

          <article class="slide zine-reader-slide" data-variant="mobile">

          <span class="zine-reader-arrow-label">Next</span>
          <span class="zine-reader-arrow-icon" aria-hidden="true">&#8250;</span>
